
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALISTAK GAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#101827;color:white;
 font-family:Arial,sans-serif;
 text-align:center;overflow:hidden
}
h1{padding:15px;color:#00ffae;text-shadow:0 0 15px #00ffae}
#game{
 width:100%;max-width:500px;height:75vh;
 max-height:650px;margin:auto;
 background:linear-gradient(#68c7ff,#d9f5ff 45%,#555 45%,#222);
 position:relative;overflow:hidden;
 border:4px solid white;border-radius:15px
}
#road{
 position:absolute;bottom:0;left:15%;
 width:70%;height:100%;
 background:#333;
 border-left:6px solid white;
 border-right:6px solid white;
}
.line{
 position:absolute;left:49%;width:5px;height:65px;
 background:white;animation:road 0.7s linear infinite
}
@keyframes road{from{top:-70px}to{top:100%}}
#player{
 position:absolute;bottom:25px;left:44%;
 width:48px;height:75px;
 background:#ff3434;border-radius:12px;
 border:3px solid white;
 box-shadow:0 0 15px black;
 z-index:5
}
#player:before{
 content:"";position:absolute;top:9px;left:7px;
 width:28px;height:22px;background:#8eeaff;
 border-radius:5px
}
.enemy{
 position:absolute;width:45px;height:70px;
 background:#ffd500;border:3px solid white;
 border-radius:12px;top:-80px;z-index:4
}
#info{padding:10px;font-size:20px}
button{
 padding:12px 24px;margin:8px;
 border:0;border-radius:10px;
 background:#00e9a0;color:#001b12;
 font-size:17px;font-weight:bold;cursor:pointer
}
#controls{display:flex;justify-content:center}
#overlay{
 position:absolute;inset:0;background:#000b;
 z-index:10;display:flex;flex-direction:column;
 align-items:center;justify-content:center
}
#overlay h2{font-size:32px;color:#00ffae;margin:15px}
#overlay p{margin:10px}
</style>
</head>
<body>

<h1>🏎️ REALISTAK GAME</h1>
<div id="info">
 Score: <span id="score">0</span>
 &nbsp; | &nbsp; Coins: <span id="coins">0</span>
</div>

<div id="game">
 <div id="road"></div>
 <div id="player"></div>
 <div id="overlay">
  <h2>REALISTAK GAME</h2>
  <p>Dodge the cars and collect points!</p>
  <button onclick="startGame()">START GAME</button>
 </div>
</div>

<div id="controls">
 <button onclick="move(-1)">⬅ LEFT</button>
 <button onclick="move(1)">RIGHT ➡</button>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const overlay=document.getElementById("overlay");
const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");

let lane=1,score=0,coins=0,running=false;
let enemies=[],lastTime=0,spawnTimer=0;
let animation;

function move(direction){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+direction));
 player.style.left=(15+lane*23.3+10)+"%";
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
});

function startGame(){
 enemies.forEach(e=>e.el.remove());
 enemies=[];
 lane=1;score=0;coins=0;
 scoreText.textContent=0;
 coinsText.textContent=0;
 player.style.left="44%";
 running=true;
 overlay.style.display="none";
 cancelAnimationFrame(animation);
 lastTime=0;spawnTimer=0;
 animation=requestAnimationFrame(loop);
}

function spawnEnemy(){
 const el=document.createElement("div");
 el.className="enemy";
 const l=Math.floor(Math.random()*3);
 el.style.left=(15+l*23.3+10)+"%";
 game.appendChild(el);
 enemies.push({el,lane:l,y:-80});
}

function loop(time){
 if(!running)return;
 const dt=Math.min((time-lastTime)/16.67,2);
 lastTime=time;
 score+=dt;
 scoreText.textContent=Math.floor(score/2);
 spawnTimer+=dt;
 if(spawnTimer>45){
  spawnEnemy();spawnTimer=0;
 }
 enemies.forEach((e,i)=>{
  e.y+=5*dt;
  e.el.style.top=e.y+"px";
  if(e.lane===lane&&e.y>game.clientHeight-115&&e.y<game.clientHeight-35){
   endGame();return;
  }
  if(e.y>game.clientHeight){
   e.el.remove();enemies.splice(i,1);
   coins++;coinsText.textContent=coins;
  }
 });
 if(running)animation=requestAnimationFrame(loop);
}

function endGame(){
 running=false;
 overlay.style.display="flex";
 overlay.innerHTML=`
 <h2>GAME OVER!</h2>
 <p>Your Score: ${Math.floor(score/2)}</p>
 <p>Coins: ${coins}</p>
 <button onclick="startGame()">PLAY AGAIN</button>`;
}
</script>
</body>
</html>
